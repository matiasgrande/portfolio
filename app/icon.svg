<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1854 1854" width="1854" height="1854">
  <title>Matías Grande</title>
  <!--
    El hero comprimido a 16px: la inicial a escala Display sangrando a los
    márgenes (DESIGN.md § Layout). Hueso sobre campo Navy — el bloque sólido
    destaca en una barra de pestañas donde casi todo es claro.

    El viewBox está en unidades del propio tipo (upm 2048) para que el trazo
    entre sin escalar. La M mide 1854 × 1440, así que el lado del cuadrado
    es su ancho y los 207 de arriba y abajo son (1854 − 1440) / 2.

    El trazo es el glifo real de Schibsted Grotesk instanciado en wght 900,
    extraído del variable font que ya sirve next/font — no una M redibujada.
    The One Voice Rule no admite una segunda letra de otra familia, ni
    siquiera acá. Las patas van abiertas (la izquierda nace en x=80 y baja a
    x=0): a 512px se lee, a 16px cae bajo el píxel. Es el tipo, no un ajuste.

    Sin radio, sin sombra, sin degradado (The Flat Rule).
  -->
  <rect width="1854" height="1854" fill="#16325C" />
  <path
    transform="translate(0 207)"
    fill="#FAF7F3"
    d="M0 1440 80 0H743L943 1170H910L1110 0H1774L1854 1440H1454L1394 286H1397L1185 1440H668L457 286H460L400 1440Z"
  />
</svg>
